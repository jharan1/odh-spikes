apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: granite-embedding-r2
  namespace: embedding-e2e-100933
  annotations:
    openshift.io/display-name: Granite Embedding R2
    openshift.io/description: RedHatAI/granite-embedding-english-r2 served by vLLM (keyless ISVC)
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    scaleTarget: 1
    scaleMetric: concurrency
    containers:
      - name: kserve-container
        image: quay.io/vllm/vllm-cpu:v0.31.0_rhaiv.2
        command:
          - python3
          - -m
          - vllm.entrypoints.openai.api_server
        env:
          - name: HF_HUB_OFFLINE
            value: "0"
          - name: TRANSFORMERS_OFFLINE
            value: "0"
          - name: HF_HOME
            value: /tmp/hf_home
        args:
          - --port=8080
          - --model=RedHatAI/granite-embedding-english-r2
          - --served-model-name
          - granite-embedding-r2
          - granite-embedding-keyless
          - --gpu-memory-utilization=0.6
        ports:
          - containerPort: 8080
            protocol: TCP
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 60
        volumeMounts:
          - name: shm
            mountPath: /dev/shm
        resources:
          limits:
            cpu: "4"
            memory: 10Gi
          requests:
            cpu: "2"
            memory: 8Gi
    volumes:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
