apiVersion: v1
kind: ConfigMap
metadata:
  name: gen-ai-aa-custom-model-endpoints
  namespace: embedding-e2e-100933
data:
  config.yaml: |
    providers:
      inference:
      - provider_id: gemini-embedding-provider
        provider_type: remote::passthrough
        config:
          base_url: https://generativelanguage.googleapis.com/v1beta/openai
          custom_gen_ai:
            api_key:
              secretRef:
                name: gemini-embedding-api-key
                key: api-key
      - provider_id: granite-embed-provider
        provider_type: remote::passthrough
        config:
          base_url: http://granite-embedding-r2-predictor.embedding-e2e-100933.svc.cluster.local:8080
    registered_resources:
      models:
      - provider_id: gemini-embedding-provider
        model_id: gemini-embedding-001
        model_type: embedding
        metadata:
          display_name: Gemini Embedding (keyed)
          embedding_dimension: 3072
      - provider_id: granite-embed-provider
        model_id: granite-embedding-keyless
        model_type: embedding
        metadata:
          display_name: Granite Embedding R2 (keyless custom endpoint)
          embedding_dimension: 768
