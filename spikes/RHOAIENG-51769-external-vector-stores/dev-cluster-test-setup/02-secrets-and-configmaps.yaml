# Secrets and ConfigMaps for the test namespace.
#
# Creates:
# - Secret/pgvector-external-credentials: pgvector password for the BFF
# - ConfigMap/gen-ai-aa-custom-model-endpoints: registers granite-embed-provider (remote::passthrough)
# - ConfigMap/gen-ai-aa-vector-stores: registers the pgvector-backed Weather Knowledge Base
#
# IMPORTANT: The credential secret must NOT be named "genai-pgvector-credentials" — that name
# collides with the BFF's auto-provisioner, which tries to create a secret with the same name
# during playground install. The auto-provisioner's credential secret validation runs after it
# creates the secret, so a pre-existing secret with that name causes "already exists" errors.
#
# Apply with:
#   oc apply -f 02-secrets-and-configmaps.yaml
---
apiVersion: v1
kind: Secret
metadata:
  name: pgvector-external-credentials
  namespace: test
type: Opaque
stringData:
  password: vectorpassword
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gen-ai-aa-custom-model-endpoints
  namespace: test
data:
  config.yaml: |
    providers:
      inference:
      - provider_id: granite-embed-provider
        provider_type: remote::passthrough
        config:
          base_url: http://granite-embedding-r2-predictor.test.svc.cluster.local
    registered_resources:
      models:
      - provider_id: granite-embed-provider
        model_id: RedHatAI/granite-embedding-english-r2
        model_type: embedding
        metadata:
          display_name: Granite Embedding R2
          embedding_dimension: 768
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gen-ai-aa-vector-stores
  namespace: test
data:
  config.yaml: |
    providers:
      vector_io:
        - provider_id: pgvector-bff-provider
          provider_type: remote::pgvector
          config:
            host: pgvector2.pgvect.svc.cluster.local
            port: 5432
            db: vectordb
            user: vectoruser
            distance_metric: COSINE
            persistence:
              backend: kv_default
              namespace: vector_io::pgvector-bff-provider
            custom_gen_ai:
              credentials:
                secretRefs:
                  - name: pgvector-external-credentials
                    key: password
    registered_resources:
      vector_stores:
        - provider_id: pgvector-bff-provider
          vector_store_id: vs_bff00003-0000-0000-0000-000000000001
          vector_store_name: "Weather Knowledge Base (Remote Embedding)"
          embedding_model: RedHatAI/granite-embedding-english-r2
          embedding_dimension: 768
          metadata:
            description: "Vector store with weather information (uses remote granite embedding)"
